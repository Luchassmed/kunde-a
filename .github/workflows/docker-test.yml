name: Build and run test container

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (inkl. submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Byg image
        run: docker build -f common/Dockerfile -t isc-test-runner .

      - name: Koer container (sandbox)
        id: run_tests
        continue-on-error: true
        env:
          ISC_USERNAME: ${{ secrets.ISC_USERNAME }}
          ISC_PASSWORD: ${{ secrets.ISC_PASSWORD }}
        run: |
          docker create --name test-run \
            -e ISC_USERNAME -e ISC_PASSWORD \
            isc-test-runner sandbox
          docker start -a test-run

      - name: Hent Playwright-rapport ud af containeren
        if: always()
        run: docker cp test-run:/app/common/playwright-report ./playwright-report

      - name: Ryd container op
        if: always()
        run: docker rm -f test-run

      - name: Upload Playwright-rapport som artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Fejl jobbet hvis testene fejlede
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
